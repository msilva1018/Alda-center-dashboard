<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Program Board — Alan Alda Center for Communicating Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#8D2138;
  --crimson-deep:#6E1A2C;
  --crimson-wash:#F6EBEE;
  --ink:#1E1C1D;
  --muted:#6B6462;
  --faint:#96908D;
  --canvas:#EDEBE9;
  --column:#E4E1DE;
  --surface:#FFFFFF;
  --line:#D7D2CE;
  --line-soft:#E7E3DF;
  --focus:#2F6B6B;
  --radius:6px;
  --shadow-card:0 1px 2px rgba(30,28,29,.10);
  --shadow-lift:0 8px 24px rgba(30,28,29,.18);
  --shadow-panel:-12px 0 40px rgba(30,28,29,.16);
  --sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"Bodoni Moda",Georgia,"Times New Roman",serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--canvas);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}

/* ---------- top bar ---------- */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:20px;padding:12px 24px;flex:none;
}
.logo{height:46px;width:auto;display:block}
.topbar-spacer{flex:1}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:10px;pointer-events:none;color:var(--faint)}
.search input{
  width:250px;padding:7px 12px 7px 32px;border:1px solid var(--line);
  border-radius:var(--radius);background:#FBFAF9;
}
.search input:focus{background:#fff;border-color:var(--crimson)}
.btn{
  border:1px solid var(--line);background:var(--surface);
  padding:7px 14px;border-radius:var(--radius);font-weight:500;
}
.btn:hover{background:#F6F4F2}
.btn-primary{background:var(--crimson);border-color:var(--crimson);color:#fff}
.btn-primary:hover{background:var(--crimson-deep);border-color:var(--crimson-deep)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--muted);padding:6px 10px}
.btn-quiet:hover{background:#F0EDEB;color:var(--ink)}
.team{display:flex}
.team .avatar{margin-left:-6px;border:2px solid #fff}

/* ---------- board header ---------- */
.header{padding:18px 24px 0;flex:none;background:var(--canvas)}
.header-top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.board-title{
  font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.005em;
  margin:0;line-height:1.1;background:none;border:none;padding:0 2px;
  min-width:160px;
}
.board-title:focus{outline:none;background:#fff;border-radius:4px;box-shadow:0 0 0 2px var(--crimson)}
.stats{display:flex;gap:18px;padding-bottom:5px;color:var(--muted);font-size:13px}
.stats b{color:var(--ink);font-weight:600}
.stats .overdue b{color:var(--crimson)}
.rule{height:2px;background:var(--ink);margin:14px 0 0}
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 0 12px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;margin-right:12px}
.tab{
  border:none;background:none;padding:6px 2px;margin-right:18px;font-weight:600;
  color:var(--muted);border-bottom:2px solid transparent;border-radius:0;
}
.tab[aria-selected="true"]{color:var(--crimson);border-bottom-color:var(--crimson)}
.toolbar-spacer{flex:1}
.ctl{display:inline-flex;align-items:center;gap:6px;position:relative}
.ctl-label{color:var(--muted);font-size:13px}
select.ctl-select{
  border:1px solid var(--line);border-radius:var(--radius);
  padding:6px 8px;background:var(--surface);font-weight:500;
}
.chip-count{
  background:var(--crimson);color:#fff;border-radius:9px;padding:0 6px;
  font-size:11px;font-weight:700;margin-left:2px;
}

/* ---------- popover ---------- */
.pop{
  position:absolute;top:calc(100% + 6px);right:0;z-index:60;width:250px;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--shadow-lift);padding:6px;max-height:60vh;overflow:auto;
}
.pop[hidden]{display:none}
.pop-group{padding:6px 8px 8px}
.pop-group + .pop-group{border-top:1px solid var(--line-soft)}
.pop-head{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.pop-item{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;cursor:pointer}
.pop-item:hover{background:#F4F1EF}
.pop-item input{accent-color:var(--crimson);margin:0}
.pop-foot{display:flex;justify-content:space-between;padding:6px 8px;border-top:1px solid var(--line-soft)}

/* ---------- board ---------- */
.board{
  flex:1;display:flex;gap:14px;padding:0 24px 20px;
  overflow-x:auto;overflow-y:hidden;align-items:flex-start;
}
.board[hidden],.charts[hidden]{display:none}
.bucket{
  flex:0 0 288px;max-height:100%;display:flex;flex-direction:column;
  background:var(--column);border-radius:8px;padding:10px 8px 8px;
}
.bucket.drag-target{background:#DAD4D0;box-shadow:inset 0 0 0 2px var(--crimson)}
.bucket-head{display:flex;align-items:center;gap:6px;padding:0 4px 8px}
.bucket-name{
  font-weight:700;font-size:14px;border:none;background:none;padding:2px 4px;
  border-radius:4px;flex:1;min-width:0;
}
.bucket-name:focus{outline:none;background:#fff;box-shadow:0 0 0 2px var(--crimson)}
.bucket-count{color:var(--muted);font-size:12px;font-weight:600}
.bucket-head .x{opacity:0;transition:opacity .12s}
.bucket:hover .bucket-head .x,.bucket-head .x:focus-visible{opacity:1}
@media (hover:none){.bucket-head .x{opacity:1}}
.bucket-list{overflow-y:auto;flex:1;padding:2px 2px 4px;display:flex;flex-direction:column;gap:8px}
.bucket-empty{
  border:1px dashed var(--line);border-radius:var(--radius);padding:14px 12px;
  color:var(--muted);font-size:13px;text-align:center;
}
.add-task{
  width:100%;text-align:left;border:1px dashed var(--line);background:transparent;
  color:var(--muted);padding:8px 10px;border-radius:var(--radius);margin-bottom:8px;font-weight:500;
}
.add-task:hover{background:#fff;color:var(--crimson);border-color:var(--crimson)}
.add-bucket{flex:0 0 240px;background:transparent}
.add-bucket .add-task{border-style:dashed;padding:12px}

/* ---------- card ---------- */
.card{
  background:var(--surface);border-radius:var(--radius);border:1px solid var(--line-soft);
  box-shadow:var(--shadow-card);padding:10px 11px;cursor:pointer;
}
.card:hover{border-color:var(--line)}
.card.dragging{opacity:.4}
.card.done .card-title{color:var(--muted)}
.labels{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px}
.label-bar{height:5px;width:34px;border-radius:3px}
.card-title{font-weight:500;line-height:1.35;margin:0 0 8px;word-break:break-word}
.card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.meta-item{display:inline-flex;align-items:center;gap:4px}
.due{padding:1px 6px;border-radius:10px;background:#F0EDEB}
.due.soon{background:#FDF3E3;color:#7A5410}
.due.late{background:var(--crimson-wash);color:var(--crimson-deep);font-weight:600}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.avatar{
  width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;color:#fff;font-size:10px;font-weight:700;letter-spacing:.02em;flex:none;
}
.avatar.sm{width:20px;height:20px;font-size:9px}
.avatars{display:flex}
.avatars .avatar + .avatar{margin-left:-7px;border:2px solid #fff}
.prio{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.prio.urgent{color:var(--crimson)}
.prio.important{color:#A9601B}
.progress-dot{width:13px;height:13px;flex:none}

/* ---------- charts ---------- */
.charts{flex:1;overflow:auto;padding:4px 24px 28px}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;max-width:980px}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:8px;padding:16px 18px}
.panel h3{margin:0 0 14px;font-size:14px;font-weight:700}
.donut-wrap{display:flex;align-items:center;gap:20px}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px;flex:1}
.legend-row{display:flex;align-items:center;gap:8px}
.swatch{width:10px;height:10px;border-radius:2px;flex:none}
.legend-row span:nth-child(2){flex:1}
.legend-row b{font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:120px 1fr 28px;align-items:center;gap:10px;font-size:13px}
.bar-track{display:block;background:#EEEAE7;border-radius:3px;height:12px;overflow:hidden}
.bar-fill{display:block;height:100%;min-width:3px;border-radius:3px;background:var(--crimson)}
.bar-row b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar-name{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- detail panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,28,29,.32);z-index:80}
.scrim[hidden],.detail[hidden]{display:none}
.detail{
  position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:90;
  background:var(--surface);box-shadow:var(--shadow-panel);
  display:flex;flex-direction:column;
}
@media (prefers-reduced-motion:no-preference){
  .detail{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
}
.detail-head{display:flex;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line-soft)}
.detail-title{
  flex:1;font-size:17px;font-weight:600;border:1px solid transparent;background:none;
  border-radius:4px;padding:5px 7px;resize:none;line-height:1.35;font-family:var(--sans);
}
.detail-title:hover{border-color:var(--line)}
.detail-title:focus{outline:none;border-color:var(--crimson)}
.detail-body{overflow-y:auto;padding:16px 18px 24px;flex:1}
.field{margin-bottom:15px}
.field > label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field select,.field input[type=date],.field textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--radius);
  padding:7px 9px;background:#FBFAF9;font-family:var(--sans);
}
.field textarea{min-height:88px;resize:vertical;line-height:1.5}
.field select:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--crimson);background:#fff}
.two-up{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle-row{display:flex;flex-wrap:wrap;gap:6px}
.toggle{
  border:1px solid var(--line);background:#FBFAF9;border-radius:14px;
  padding:4px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px;
}
.toggle[aria-pressed="true"]{border-color:transparent;color:#fff;font-weight:500}
.toggle .swatch{width:8px;height:8px;border-radius:50%}
.toggle[aria-pressed="true"] .swatch{background:#fff!important}
.check-list{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.check-item{display:flex;align-items:center;gap:8px;padding:4px 2px;border-radius:4px}
.check-item:hover{background:#F6F4F2}
.check-item input[type=checkbox]{accent-color:var(--crimson);flex:none}
.check-item input[type=text]{flex:1;border:none;background:none;padding:2px 4px;border-radius:3px}
.check-item input[type=text]:focus{outline:none;background:#fff;box-shadow:0 0 0 1px var(--line)}
.check-item.done input[type=text]{color:var(--faint);text-decoration:line-through}
.x{border:none;background:none;color:var(--faint);padding:2px 6px;border-radius:4px;line-height:1}
.x:hover{color:var(--crimson);background:var(--crimson-wash)}
.detail-foot{border-top:1px solid var(--line-soft);padding:12px 18px;display:flex;justify-content:space-between}
.btn-danger{color:var(--crimson);border-color:transparent;background:none}
.btn-danger:hover{background:var(--crimson-wash)}

/* ---------- links and files ---------- */
.att-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.att{
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;
  border:1px solid var(--line-soft);background:#FBFAF9;font-size:13px;
}
.att:hover{border-color:var(--line)}
.att a{color:var(--crimson-deep);text-decoration:none;font-weight:500;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att a:hover{text-decoration:underline}
.att .att-sub{color:var(--faint);font-size:11px;flex:none;font-variant-numeric:tabular-nums}
.att svg{flex:none;color:var(--muted)}
.add-row{display:flex;gap:6px;flex-wrap:wrap}
.add-row input{
  flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--radius);
  padding:7px 9px;background:#FBFAF9;
}
.add-row input:focus{outline:none;border-color:var(--crimson);background:#fff}
.add-row input.url{flex:2 1 170px}
.drop{
  border:1px dashed var(--line);border-radius:var(--radius);padding:12px;
  display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;
}
.drop.over{border-color:var(--crimson);background:var(--crimson-wash);color:var(--crimson-deep)}
.hint{font-size:12px;color:var(--faint);margin:7px 0 0;min-height:17px}
.hint.warn{color:var(--crimson)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- sign-in gate ---------- */
.gate{
  position:fixed;inset:0;z-index:200;background:var(--canvas);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.gate[hidden]{display:none}
.gate-card{width:100%;max-width:392px}
.gate-logo{width:100%;max-width:330px;height:auto;display:block;margin:0 auto}
.gate-rule{height:2px;background:var(--ink);margin:26px 0 22px}
.gate-card h2{
  font-family:var(--serif);font-weight:600;font-size:23px;margin:0 0 4px;letter-spacing:.005em;
}
.gate-card p{color:var(--muted);margin:0 0 18px;font-size:13px}
.gate-field{display:flex;gap:8px}
.gate-field input{
  flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
}
.gate-field input:focus{outline:none;border-color:var(--crimson);box-shadow:0 0 0 3px var(--crimson-wash)}
.gate-err{color:var(--crimson);font-size:13px;font-weight:500;margin:10px 0 0;min-height:19px}
.gate-remember{display:flex;align-items:center;gap:7px;margin-top:14px;font-size:13px;color:var(--muted)}
.gate-remember input{accent-color:var(--crimson);margin:0}

/* ---------- modal dialog ---------- */
.dlg-scrim{
  position:fixed;inset:0;z-index:210;background:rgba(30,28,29,.38);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.dlg-scrim[hidden]{display:none}
.dlg{
  background:var(--surface);border-radius:8px;box-shadow:var(--shadow-lift);
  width:100%;max-width:392px;padding:20px 22px 16px;
}
.dlg h3{margin:0 0 7px;font-size:16px;font-weight:700}
.dlg p{margin:0 0 14px;color:var(--muted);line-height:1.5}
.dlg input[type=password],.dlg input[type=text]{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);
  background:#FBFAF9;margin-bottom:10px;
}
.dlg input:focus{outline:none;border-color:var(--crimson);background:#fff}
.dlg code{
  display:block;background:#F4F1EF;border:1px solid var(--line-soft);border-radius:4px;
  padding:9px 10px;font-size:11px;word-break:break-all;margin-bottom:12px;line-height:1.5;
}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

.save-status{color:var(--faint);font-size:12px;margin-right:6px;white-space:nowrap}
@media (max-width:760px){
  .topbar{padding:10px 14px;gap:12px;flex-wrap:wrap}
  .search input{width:150px}
  .header{padding:14px 14px 0}
  .board{padding:0 14px 16px}
  .charts{padding:4px 14px 24px}
  .board-title{font-size:24px}
  .team{display:none}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <img class="gate-logo" id="gateLogo" alt="Alan Alda Center for Communicating Science at Stony Brook University">
    <div class="gate-rule"></div>
    <h2>Program board</h2>
    <p>Enter the team password to open the board.</p>
    <div class="gate-field">
      <input type="password" id="gatePass" placeholder="Password" autocomplete="current-password" aria-label="Team password">
      <button class="btn btn-primary" id="gateGo">Open board</button>
    </div>
    <label class="gate-remember">
      <input type="checkbox" id="gateRemember" checked> Stay signed in on this device
    </label>
    <p class="gate-err" id="gateErr" role="alert"></p>
  </div>

function sha256(msg){
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  const bytes=[]; const s=unescape(encodeURIComponent(msg));
  for(let i=0;i<s.length;i++) bytes.push(s.charCodeAt(i));
  const bitLen=bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64!==56) bytes.push(0);
  for(let i=0;i<4;i++) bytes.push(0);
  bytes.push((bitLen>>>24)&255,(bitLen>>>16)&255,(bitLen>>>8)&255,bitLen&255);
  const h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w=new Array(64);
  for(let i=0;i<bytes.length;i+=64){
    for(let t=0;t<16;t++)
      w[t]=(bytes[i+t*4]<<24)|(bytes[i+t*4+1]<<16)|(bytes[i+t*4+2]<<8)|bytes[i+t*4+3];
    for(let t=16;t<64;t++){
      const a1=w[t-15], a2=w[t-2];
      const s0=rotr(a1,7)^rotr(a1,18)^(a1>>>3);
      const s1=rotr(a2,17)^rotr(a2,19)^(a2>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)|0;
    }
    let [a,b,c,d,e,f,g,hh]=h;
    for(let t=0;t<64;t++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch=(e&f)^(~e&g);
      const t1=(hh+S1+ch+SHA_K[t]+w[t])|0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    h[0]=(h[0]+a)|0;h[1]=(h[1]+b)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;
    h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0;
  }
  return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

/* ---------- storage ----------
   Writes to every backend available, so the board keeps its data whether
   it is opened here, opened from your desktop, or hosted on a web server.
   Note this is per-browser storage, not a shared server. Two people on
   two machines keep two separate copies. Use Export to hand off a copy. */
const store = {
  async raw(key){
    let cloud = null, local = null;
    try{
      if(window.storage){
        const r = await window.storage.get(key);
        if(r && r.value) cloud = r.value;
      }
    }catch(e){}
    try{ local = window.localStorage.getItem(key); }catch(e){}
    return cloud || local;
  },
  async put(key, value){
    let saved = false;
    try{
      if(window.storage){ await window.storage.set(key, value); saved = true; }
    }catch(e){}
    try{ window.localStorage.setItem(key, value); saved = true; }catch(e){}
    return saved;
  },
  async drop(key){
    try{ if(window.storage) await window.storage.delete(key); }catch(e){}
    try{ window.localStorage.removeItem(key); }catch(e){}
  },
  async load(){
    const v = await store.raw(STORE_KEY);
    try{ return v ? JSON.parse(v) : null; }catch(e){ return null; }
  },
  async save(){
    const ok = await store.put(STORE_KEY, JSON.stringify(state));
    if(sync.on()) return;
    setSaveStatus(ok ? 'Saved ' + stamp()
                     : 'Not saved in this browser. Use Export to keep a copy.');
  },
  async clear(){ await store.drop(STORE_KEY); }
};

let saveTimer = null;
let pushTimer = null;
let dirty = false;
let applyingRemote = false;

function setSaveStatus(text){

}
const stamp = () => new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});

/* ---------- shared sheet ---------- */
const sync = {
  rev: 0,
  on(){ return !!SHEET_URL; },
  async call(payload){
    // text/plain keeps this a "simple" request, so the browser skips the
    // CORS preflight that Apps Script cannot answer.
    const res = await fetch(SHEET_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({token:SHEET_TOKEN}, payload)),
      redirect:'follow'
    });
    return res.json();
  },
  load(){ return sync.call({action:'load'}); },
  push(force){ return sync.call({action:'save', rev:sync.rev, board:state, force:!!force}); }
};

let pushing = false;   // a save to the sheet is in flight
let editSeq = 0;       // bumps on every local edit

function queueSave(){
  if(!unlocked) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store.save(), 300);
  if(applyingRemote) return;
  if(sync.on()){
    dirty = true;
    editSeq++;
    setSaveStatus('Syncing');
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushRemote, 1500);
  }else{
    setSaveStatus('Saving');
  }
}

/* One save at a time. Apps Script takes seconds to answer, and two saves in
   flight with the same revision made the second look like a stranger's
   conflicting edit. Edits that land while a save is out go in one
   follow-up save when it returns. */
async function pushRemote(){
  if(!sync.on() || !unlocked) return;
  clearTimeout(pushTimer);
  if(pushing) return;               // the finally block picks up the rest
  pushing = true;
  const sentSeq = editSeq;
  try{
    let res = await sync.push(false);
    if(res && res.conflict){
      const choice = await dialog({
        title:'Someone else saved first',
        body:'The shared sheet changed while you were editing. Keep your version and overwrite theirs, or load theirs and drop your recent changes.',
        ok:'Keep mine', alt:'Load theirs', noCancel:true});
      if(choice === 'alt'){
        sync.rev = res.rev;
        adoptRemote(res.board);
        setSaveStatus('Loaded the shared version');
        return;
      }
      if(choice !== true){
        // Dismissed with Escape or a click outside. Throwing work away needs
        // an explicit click, so keep local changes and ask on the next save.
        setSaveStatus('Not saved yet. The sheet has newer changes.');
        return;
      }
      sync.rev = res.rev;
      res = await sync.push(true);
    }
    if(res && res.ok){
      sync.rev = res.rev;
      if(editSeq === sentSeq){
        dirty = false;
        setSaveStatus('Saved to the sheet ' + stamp());
      }
    }else{
      setSaveStatus((res && res.error) || 'The sheet refused the save');
    }
  }catch(e){
    setSaveStatus('Sheet unreachable. Saved on this device only.');
  }finally{
    pushing = false;
    if(dirty && editSeq !== sentSeq) pushTimer = setTimeout(pushRemote, 300);
  }
}

function adoptRemote(board){
  if(!board || !board.tasks || !board.buckets) return;
  applyingRemote = true;
  state = normalize(board);
  dirty = false;
  render();
  applyingRemote = false;
}

/* True while someone has typed into a board field without committing it.
   Adopting a remote board redraws those fields and would wipe the typing. */
function typing(){
  const el = document.activeElement;
  if(!el) return false;
  if(el.matches && el.matches('.bucket-name[data-bucket]')){
    const b = state.buckets.find(x => x.id === el.dataset.bucket);
    return !b || el.value !== b.name;
  }
  if(el.id === 'boardTitle') return el.textContent.trim() !== state.title;
  return false;
}
/* Pull other people's changes, but never over this person's unsaved work. */
function busy(){
  return dirty || pushing || typing() || !$('#detail').hidden || !$('#dlgScrim').hidden;
}
async function pollRemote(){
  if(!sync.on() || !unlocked || busy()) return;
  try{
    const res = await sync.load();
    // The load took seconds; if they started editing meanwhile, their
    // change wins and this result is stale.
    if(busy()) return;
    if(res && res.ok && res.board && res.rev > sync.rev){
      sync.rev = res.rev;
      adoptRemote(res.board);
      setSaveStatus('Updated from the sheet ' + stamp());
    }
  }catch(e){ /* offline; the local cache still holds */ }
}
setInterval(pollRemote, 10000);
window.addEventListener('focus', pollRemote);

  clearTimeout(saveTimer);

/* Switching tabs or minimising: the page stays alive, so save the normal
   way and let the reply record the new revision. The old version fired a
   save here whose reply was thrown away, so the next edit tripped over it. */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'hidden' || !unlocked) return;
  flushLocal();
  if(sync.on() && dirty) pushRemote();
});

/* Closing or reloading: no reply will arrive, so send with keepalive. It is
   never forced, so a stale page cannot overwrite someone else's newer save;
   at worst the last second of typing stays on this device only. Browsers
   cap keepalive bodies at 64 KB, so a very large board fails quietly here
   and relies on its regular save. */
function flushOnExit(){
  if(!unlocked) return;
  flushLocal();
  if(!sync.on() || !dirty || pushing) return;
  clearTimeout(pushTimer);
  try{
    fetch(SHEET_URL, {method:'POST', keepalive:true,
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:SHEET_TOKEN, action:'save', rev:sync.rev, board:state, force:false})
    }).catch(() => {});
  }catch(e){}
}
window.addEventListener('pagehide', flushOnExit);
window.addEventListener('beforeunload', flushOnExit);

const HEX = /^#[0-9a-f]{3}([0-9a-f]{3})?$/i;
const cleanColor = (c, fallback) => HEX.test(String(c || '')) ? String(c) : fallback;
const cleanRef   = v => String(v == null ? '' : v).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 80);
const cleanId    = v => cleanRef(v) || uid('x');
const str        = v => v == null ? '' : String(v);
const PROGRESS_IDS = ['notstarted','inprogress','completed'];
const PRIORITY_IDS = ['urgent','important','medium','low'];

function normalize(board){
  if(!board || !Array.isArray(board.tasks)) return board;
  const arr = v => Array.isArray(v) ? v : [];

  board.title   = str(board.title) || 'Untitled board';
  board.buckets = arr(board.buckets).map(b => ({id:cleanId(b.id), name:str(b.name)}));
  board.members = arr(board.members).map(m => ({id:cleanId(m.id), name:str(m.name) || 'Member',
                                                color:cleanColor(m.color, '#6B6462')}));
  board.labels  = arr(board.labels).map(l => ({id:cleanId(l.id), name:str(l.name) || 'Label',
                                               color:cleanColor(l.color, '#5A5A5F')}));

  board.tasks = board.tasks.map(t => ({
    id:        cleanId(t.id),
    bucket:    cleanRef(t.bucket),
    title:     str(t.title),
    progress:  PROGRESS_IDS.includes(t.progress) ? t.progress : 'notstarted',
    priority:  PRIORITY_IDS.includes(t.priority) ? t.priority : 'medium',
    due:       /^\d{4}-\d{2}-\d{2}$/.test(str(t.due)) ? t.due : '',
    assignees: arr(t.assignees).map(cleanRef).filter(Boolean),
    labels:    arr(t.labels).map(cleanRef).filter(Boolean),
    notes:     str(t.notes),
    checklist: arr(t.checklist).map(c => ({id:cleanId(c.id), text:str(c.text), done:!!c.done})),
    links:     arr(t.links).map(l => ({id:cleanId(l.id), url:str(l.url), label:str(l.label)})),
    files:     arr(t.files).map(f => {
      const o = {id:cleanId(f.id), name:str(f.name) || 'Attachment', url:str(f.url), kind:str(f.kind)};
      if(f.driveId) o.driveId = cleanRef(f.driveId);
      if(f.size != null && isFinite(Number(f.size))) o.size = Number(f.size);
      if(f.mime) o.mime = str(f.mime);
      return o;
    })
  }));
  return board;
}
/* Only http and https are allowed through, so a pasted javascript: URL
   cannot fire when a colleague clicks it. */
function safeUrl(u){
  try{
    const p = new URL(String(u).trim());
    return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : '';
  }catch(e){ return ''; }
}
function fmtSize(n){
  if(!n && n !== 0) return '';
  if(n < 1024) return n + ' B';
  if(n < 1048576) return Math.round(n/1024) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
const member = id => state.members.find(m => m.id === id);
const label = id => state.labels.find(l => l.id === id);
const initials = n => n.trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
const today = () => day(0);

function dueClass(t){
  if(!t.due || t.progress === 'completed') return '';
  if(t.due < today()) return ' late';
  if(t.due <= day(3)) return ' soon';
  return '';
}
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function progressIcon(p, size){
  const c = (PROGRESS.find(x => x.id === p) || PROGRESS[0]).color;
  const s = size || 13;
  if(p === 'completed')
    return `<svg class="progress-dot" width="${s}" height="${s}" viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="8" cy="8" r="7" fill="${c}"/><path d="M4.6 8.2 7 10.6l4.4-4.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if(p === 'inprogress')
    return `<svg class="progress-dot" width="${s}" height="${s}" viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="8" cy="8" r="7" fill="none" stroke="${c}" stroke-width="1.8"/>
      <path d="M8 1.5A6.5 6.5 0 0 1 8 14.5Z" fill="${c}"/></svg>`;
  return `<svg class="progress-dot" width="${s}" height="${s}" viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="8" cy="8" r="7" fill="none" stroke="${c}" stroke-width="1.8"/></svg>`;
}
function avatar(m, sm){
  return `<span class="avatar${sm?' sm':''}" style="background:${m.color}" title="${esc(m.name)}">${esc(initials(m.name))}</span>`;
}

/* ---------- filtering ---------- */
function visible(t){
  if(query){
    const hay = (t.title + ' ' + (t.notes||'')).toLowerCase();
    if(!hay.includes(query)) return false;
  }
  if(filters.progress.size && !filters.progress.has(t.progress)) return false;
  if(filters.priority.size && !filters.priority.has(t.priority)) return false;
  if(filters.label.size && !t.labels.some(l => filters.label.has(l))) return false;
  if(filters.assignee.size && !t.assignees.some(a => filters.assignee.has(a))) return false;
  return true;
}
function filterCount(){
  return Object.values(filters).reduce((n,s) => n + s.size, 0);
}

/* ---------- columns ---------- */
function columns(){
  if(groupBy === 'bucket')
    return state.buckets.map(b => ({key:b.id, name:b.name, editable:true}));
  if(groupBy === 'progress')
    return PROGRESS.map(p => ({key:p.id, name:p.name}));
  if(groupBy === 'priority')
    return PRIORITY.map(p => ({key:p.id, name:p.name}));
  if(groupBy === 'assignee')
    return state.members.map(m => ({key:m.id, name:m.name})).concat([{key:'', name:'Unassigned'}]);
  return state.labels.map(l => ({key:l.id, name:l.name})).concat([{key:'', name:'No label'}]);
}
function inColumn(t, key){
  if(groupBy === 'bucket')   return t.bucket === key;
  if(groupBy === 'progress') return t.progress === key;
  if(groupBy === 'priority') return t.priority === key;
  if(groupBy === 'assignee') return key === '' ? t.assignees.length === 0 : t.assignees.includes(key);
  return key === '' ? t.labels.length === 0 : t.labels.includes(key);
}
function assignColumn(t, key){
  if(groupBy === 'bucket')        t.bucket = key;
  else if(groupBy === 'progress') t.progress = key;
  else if(groupBy === 'priority') t.priority = key;
  else if(groupBy === 'assignee') t.assignees = key ? [key] : [];
  else                            t.labels = key ? [key] : [];
}

/* ---------- render ---------- */
function render(){
  $('#boardTitle').textContent = state.title;
  renderTeam();
  renderStats();
  $('#board').hidden = view !== 'board';
  $('#charts').hidden = view !== 'charts';
  document.querySelectorAll('.tab').forEach(t =>
    t.setAttribute('aria-selected', String(t.dataset.view === view)));
  const n = filterCount();
  $('#filterCount').hidden = n === 0;
  $('#filterCount').textContent = n;
  if(view === 'board') renderBoard(); else renderCharts();
  queueSave();
}

function renderTeam(){
  $('#team').innerHTML = state.members.slice(0,5).map(m => avatar(m)).join('');
}

function renderStats(){
  const t = state.tasks;
  const done = t.filter(x => x.progress === 'completed').length;
  const late = t.filter(x => x.due && x.due < today() && x.progress !== 'completed').length;
  $('#stats').innerHTML =
    `<span><b>${t.length}</b> tasks</span>
     <span><b>${done}</b> completed</span>
     <span class="overdue"><b>${late}</b> past due</span>`;
}

function renderBoard(){
  const board = $('#board');
  board.innerHTML = columns().map(col => {
    const list = state.tasks.filter(t => inColumn(t, col.key) && visible(t));
    const nameEl = col.editable
      ? `<input class="bucket-name" value="${esc(col.name)}" data-bucket="${col.key}" aria-label="Bucket name">`
      : `<span class="bucket-name">${esc(col.name)}</span>`;
    const remove = col.editable
      ? `<button class="x" data-del-bucket="${col.key}" title="Delete bucket" aria-label="Delete bucket ${esc(col.name)}">&times;</button>` : '';
    return `<section class="bucket" data-col="${esc(col.key)}">
      <div class="bucket-head">${nameEl}<span class="bucket-count">${list.length}</span>${remove}</div>
      <button class="add-task" data-add="${esc(col.key)}">+ Add a task</button>
      <div class="bucket-list" data-col="${esc(col.key)}">
        ${list.map(cardHTML).join('') ||
          '<div class="bucket-empty">Nothing here yet</div>'}
      </div>
    </section>`;
  }).join('') + (groupBy === 'bucket'
    ? `<div class="add-bucket"><button class="add-task" id="addBucket">+ Add a bucket</button></div>` : '');
  wireBoard();
}

function cardHTML(t){
  const bars = t.labels.map(id => {
    const l = label(id);
    return l ? `<span class="label-bar" style="background:${l.color}" title="${esc(l.name)}"></span>` : '';
  }).join('');
  const checks = t.checklist.length
    ? `<span class="meta-item">${t.checklist.filter(c => c.done).length}/${t.checklist.length} done</span>` : '';
  const due = t.due
    ? `<span class="due${dueClass(t)}">${fmtDate(t.due)}</span>` : '';
  const note = t.notes
    ? `<span class="meta-item" title="Has notes">&#9776;</span>` : '';
  const nLinks = (t.links || []).length;
  const nFiles = (t.files || []).length;
  const links = nLinks
    ? `<span class="meta-item" title="${nLinks} link${nLinks>1?'s':''}">&#128279; ${nLinks}</span>` : '';
  const files = nFiles
    ? `<span class="meta-item" title="${nFiles} file${nFiles>1?'s':''}">&#128206; ${nFiles}</span>` : '';
  const prio = (t.priority === 'urgent' || t.priority === 'important')
    ? `<span class="prio ${t.priority}">${t.priority === 'urgent' ? '!' : '&#8593;'} ${t.priority === 'urgent' ? 'Urgent' : 'Important'}</span>` : '';
  const people = t.assignees.map(id => {
    const m = member(id); return m ? avatar(m, true) : '';
  }).join('');
  return `<article class="card${t.progress === 'completed' ? ' done' : ''}" draggable="true" data-id="${t.id}" tabindex="0">
    ${bars ? `<div class="labels">${bars}</div>` : ''}
    <p class="card-title">${esc(t.title)}</p>
    <div class="card-meta">${progressIcon(t.progress)}${due}${checks}${links}${files}${note}</div>
    <div class="card-foot">${prio || '<span></span>'}<span class="avatars">${people}</span></div>
  </article>`;
}

/* ---------- board wiring ---------- */
function wireBoard(){
  document.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => openDetail(el.dataset.id));
    el.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openDetail(el.dataset.id); }
    });
    el.addEventListener('dragstart', e => {
      dragId = el.dataset.id;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', dragId); }catch(err){}
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      document.querySelectorAll('.drag-target').forEach(x => x.classList.remove('drag-target'));
      dragId = null;
    });
  });

  document.querySelectorAll('.bucket-list').forEach(list => {
    list.addEventListener('dragover', e => {
      e.preventDefault();
      list.closest('.bucket').classList.add('drag-target');
    });
    list.addEventListener('dragleave', e => {
      if(!list.contains(e.relatedTarget)) list.closest('.bucket').classList.remove('drag-target');
    });
    list.addEventListener('drop', e => {
      e.preventDefault();
      list.closest('.bucket').classList.remove('drag-target');
      if(!dragId) return;
      drop(dragId, list.dataset.col, afterElement(list, e.clientY));
    });
  });

  document.querySelectorAll('[data-add]').forEach(btn =>
    btn.addEventListener('click', () => addTask(btn.dataset.add)));
  document.querySelectorAll('[data-bucket]').forEach(inp =>
    inp.addEventListener('change', () => {
      const b = state.buckets.find(x => x.id === inp.dataset.bucket);
      if(b){ b.name = inp.value.trim() || 'Untitled bucket'; render(); }
    }));
  document.querySelectorAll('[data-del-bucket]').forEach(btn =>
    btn.addEventListener('click', () => deleteBucket(btn.dataset.delBucket)));
  const ab = $('#addBucket');
  if(ab) ab.addEventListener('click', addBucket);
}

function afterElement(list, y){
  const cards = [...list.querySelectorAll('.card:not(.dragging)')];
  for(const c of cards){
    const box = c.getBoundingClientRect();
    if(y < box.top + box.height / 2) return c;
  }
  return null;
}

function drop(id, colKey, beforeEl){
  const t = task(id);
  if(!t) return;
  assignColumn(t, colKey);
  const from = state.tasks.indexOf(t);
  state.tasks.splice(from, 1);
  let at = state.tasks.length;
  if(beforeEl){
    const idx = state.tasks.findIndex(x => x.id === beforeEl.dataset.id);
    if(idx > -1) at = idx;
  }else{
    const last = state.tasks.filter(x => inColumn(x, colKey)).pop();
    if(last) at = state.tasks.indexOf(last) + 1;
  }
  state.tasks.splice(at, 0, t);
  render();
}

/* ---------- create / delete ---------- */
function addTask(colKey){
  const t = {
    id:uid('t'), bucket:state.buckets[0] ? state.buckets[0].id : '',
    title:'New task', progress:'notstarted', priority:'medium',
    due:'', assignees:[], labels:[], notes:'', links:[], files:[], checklist:[]
  };
  assignColumn(t, colKey);
  state.tasks.unshift(t);
  render();
  openDetail(t.id);
  setTimeout(() => { $('#dTitle').select(); }, 60);
}
function addBucket(){
  state.buckets.push({id:uid('b'), name:'New bucket'});
  render();
  const inputs = document.querySelectorAll('[data-bucket]');
  const last = inputs[inputs.length - 1];
  if(last){ last.focus(); last.select(); }
}
/* Trash the Drive copies of anything the board uploaded for these tasks.
   Pasted links are left alone; those files belong to someone else. */
function trashUploads(tasks){
  if(!sync.on()) return;
  tasks.forEach(t => (t.files || []).forEach(f => {
    if(f.driveId) sync.call({action:'deletefile', id:f.driveId}).catch(() => {});
  }));
}

async function deleteBucket(id){
  if(state.buckets.length < 2){
    await dialog({title:'Keep at least one bucket', body:'A board needs somewhere to put tasks. Rename this one instead.', ok:'Got it', noCancel:true});
    return;
  }
  const b = state.buckets.find(x => x.id === id);
  if(!b) return;
  const inside = state.tasks.filter(t => t.bucket === id);
  const target = state.buckets.find(x => x.id !== id);
  let mode = 'delete';

  if(inside.length){
    const n = inside.length, many = n > 1;
    const uploads = inside.reduce((c, t) => c + (t.files || []).filter(f => f.driveId).length, 0);
    const choice = await dialog({
      title:`Delete "${b.name}"?`,
      body:`It holds ${n} task${many?'s':''}. Delete ${many?'them':'it'} with the bucket, or move ${many?'them':'it'} to "${target.name}" to keep ${many?'them':'it'}.` +
           (uploads ? ` Deleting also sends ${uploads} uploaded file${uploads>1?'s':''} to the Drive trash.` : ''),
      ok:`Delete bucket and ${n} task${many?'s':''}`, danger:true,
      alt:`Move to "${target.name}"`});
    if(!choice) return;
    mode = choice === 'alt' ? 'move' : 'delete';
  }

  // A sync may have swapped the board while the dialog was open; re-check.
  if(!state.buckets.some(x => x.id === id)) return;
  const keep = state.buckets.find(x => x.id !== id);
  state.buckets = state.buckets.filter(x => x.id !== id);
  if(mode === 'move'){
    state.tasks.forEach(t => { if(t.bucket === id) t.bucket = keep.id; });
  }else{
    const gone = state.tasks.filter(t => t.bucket === id);
    state.tasks = state.tasks.filter(t => t.bucket !== id);
    trashUploads(gone);
  }
  render();
}

/* ---------- detail panel ---------- */

  $('#dTitle').value = t.title;
  $('#dBucket').innerHTML = state.buckets.map(b =>
    `<option value="${b.id}"${b.id===t.bucket?' selected':''}>${esc(b.name)}</option>`).join('');

  $('#dPriority').innerHTML = PRIORITY.map(p =>

       style="${t.assignees.includes(m.id)?`background:${m.color}`:''}">
       <span class="swatch" style="background:${m.color}"></span>${esc(m.name)}</button>`).join('');

function renderChecklist(t){

    `<div class="check-item${c.done?' done':''}" data-check="${c.id}">
       <input type="checkbox"${c.done?' checked':''} aria-label="Mark done">

     </div>`).join('');
}
function renderAttachments(t){
  $('#dLinks').innerHTML = t.links.map(l => {
    const href = safeUrl(l.url);
    if(!href) return '';
    return `<div class="att"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6.8 9.2a2.6 2.6 0 0 0 3.7 0l2.2-2.2a2.6 2.6 0 0 0-3.7-3.7l-1 1"/><path d="M9.2 6.8a2.6 2.6 0 0 0-3.7 0L3.3 9a2.6 2.6 0 0 0 3.7 3.7l1-1"/></svg>
      <a href="${esc(href)}" target="_blank" rel="noopener noreferrer"
         title="${esc(href)}">${esc(l.label || href.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</a>

    const href = safeUrl(f.url);

    return `<div class="att"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.8H4.2a1 1 0 0 0-1 1v10.4a1 1 0 0 0 1 1h7.6a1 1 0 0 0 1-1V5.6z"/><path d="M9 1.8V5.6h3.8"/></svg>
      ${href ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(href)}">${name}</a>`
             : `<span style="flex:1">${name}</span>`}
      <span class="att-sub">${sub}</span>

  setFileHint('');
}
function setFileHint(msg, warn){
  const el = $('#fileHint');
  el.textContent = msg || '';
  el.classList.toggle('warn', !!warn);
}

/* ---------- file links ----------
   Files live in OneDrive or SharePoint. The board stores a pointer, so the
   file keeps whatever permissions you gave it there. */

// OneDrive and SharePoint share links carry a type marker like /:x:/
const OD_KIND = {w:'Word', x:'Excel', p:'PowerPoint', b:'PDF', f:'Folder',
                 i:'Image', v:'Video', t:'Text', u:'File', o:'File'};

function inspectFileLink(href){
  try{
    const u = new URL(href);
    const m = u.pathname.match(/\/:([a-z]):\//i);
    const kind = m ? (OD_KIND[m[1].toLowerCase()] || 'File') : '';
    const last = decodeURIComponent(u.pathname.split('/').filter(Boolean).pop() || '');
    const name = /\.[a-z0-9]{2,5}$/i.test(last) ? last : '';
    const host = u.hostname.replace(/^www\./, '');
    const cloud = /(^|\.)sharepoint\.com$|(^|\.)1drv\.ms$|onedrive\.live\.com$/i.test(host);
    return {name, kind, host, cloud};
  }catch(e){ return {name:'', kind:'', host:'', cloud:false}; }
}

/* ---------- uploads ---------- */
const MAX_FILE = 8 * 1024 * 1024;   // Apps Script chokes on much more than this

function readBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(new Error('Could not read the file'));
    r.readAsDataURL(file);
  });
}

async function uploadFiles(list){
  if(!openId) return;
  if(!sync.on()){
    setFileHint('Uploading needs the shared sheet. Add your SHEET_URL, or paste a link instead.', true);
    return;
  }
  const files = [...list];
  for(let i = 0; i < files.length; i++){
    const f   = files[i];
    const tag = files.length > 1 ? ` (${i+1} of ${files.length})` : '';
    if(f.size > MAX_FILE){
      setFileHint(`${f.name} is ${fmtSize(f.size)}. Anything over 8 MB should live in Drive with a link here instead.`, true);
      continue;
    }
    setFileHint(`Uploading ${f.name}${tag}`);
    try{
      const data = await readBase64(f);
      const res  = await sync.call({action:'upload', name:f.name,
                                    mime:f.type || 'application/octet-stream', data});
      if(res && res.ok){
        // driveId marks this as ours to clean up when it is removed
        edit(t => t.files.push({id:uid('f'), driveId:res.id, name:res.name,
                                size:res.size, mime:res.mime, url:res.url}));
        renderAttachments(task(openId));
        setFileHint('');
      }else{
        setFileHint((res && res.error) || 'The upload was refused.', true);
      }
    }catch(e){
      setFileHint('Upload failed. Check the connection and try again.', true);
    }
  }
}

function addFileFromInputs(rawInput){
  if(!openId) return;
  const raw = (rawInput !== undefined ? rawInput : $('#fileUrl').value).trim();
  if(!raw) return;
  const href = safeUrl(/^[a-z]+:\/\//i.test(raw) ? raw : 'https://' + raw);
  if(!href){
    setFileHint('That does not look like a web address.', true);
    return;
  }
  const info = inspectFileLink(href);
  const typed = $('#fileName').value.trim();
  const name  = typed || info.name || (info.kind ? info.kind + ' file' : info.host);

  let kind = info.kind || (info.cloud ? 'OneDrive' : info.host);
  if(kind === name) kind = '';   // no point repeating the name as its own label
  edit(t => t.files.push({id:uid('f'), name, url:href, kind}));
  $('#fileUrl').value = '';
  $('#fileName').value = '';
  renderAttachments(task(openId));
  setFileHint('');
  $('#fileUrl').focus();
}

function closeDetail(){
  openId = null;
  $('#scrim').hidden = true;
  $('#detail').hidden = true;
  render();
}
function edit(fn){
  const t = task(openId);
  if(!t) return;
  fn(t);
  queueSave();
  if(view === 'board') renderBoard(); else renderCharts();
  renderStats();
}

/* ---------- charts ---------- */
function renderCharts(){
  const list = state.tasks.filter(visible);
  const byProgress = PROGRESS.map(p => ({
    name:p.name, color:p.color, n:list.filter(t => t.progress === p.id).length }));
  const total = list.length || 1;

  let acc = 0;
  const arcs = byProgress.map(s => {
    const frac = s.n / total, r = 54, C = 2 * Math.PI * r;
    const seg = `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${s.color}" stroke-width="22"
      stroke-dasharray="${(frac*C).toFixed(2)} ${C.toFixed(2)}"
      stroke-dashoffset="${(-acc*C).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
    acc += frac;
    return seg;
  }).join('');

  const bars = (rows, accent) => `<div class="bars">${rows.map(r => {
    const max = Math.max(1, ...rows.map(x => x.n));
    return `<div class="bar-row"><span class="bar-name" title="${esc(r.name)}">${esc(r.name)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${(r.n/max*100).toFixed(1)}%;background:${r.color||accent}"></span></span>
      <b>${r.n}</b></div>`;
  }).join('')}</div>`;

  const byBucket = state.buckets.map(b => ({name:b.name, n:list.filter(t => t.bucket === b.id).length}));
  const byPriority = PRIORITY.map(p => ({name:p.name, n:list.filter(t => t.priority === p.id).length}));
  const byMember = state.members.map(m => ({
    name:m.name, color:m.color,
    n:list.filter(t => t.assignees.includes(m.id) && t.progress !== 'completed').length
  })).concat([{name:'Unassigned', n:list.filter(t => !t.assignees.length && t.progress !== 'completed').length}]);

  $('#charts').innerHTML = `<div class="chart-grid">
    <div class="panel"><h3>Progress</h3>
      <div class="donut-wrap">
        <svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Task progress breakdown">
          <circle cx="70" cy="70" r="54" fill="none" stroke="#EEEAE7" stroke-width="22"/>
          ${arcs}
          <text x="70" y="65" text-anchor="middle" font-size="24" font-weight="700" fill="#1E1C1D">${list.length}</text>
          <text x="70" y="82" text-anchor="middle" font-size="11" fill="#6B6462">tasks</text>
        </svg>
        <div class="legend">${byProgress.map(s =>
          `<div class="legend-row"><span class="swatch" style="background:${s.color}"></span>
           <span>${s.name}</span><b>${s.n}</b></div>`).join('')}</div>
      </div></div>
    <div class="panel"><h3>Tasks by bucket</h3>${bars(byBucket, '#8D2138')}</div>
    <div class="panel"><h3>Tasks by priority</h3>${bars(byPriority, '#8D2138')}</div>
    <div class="panel"><h3>Open tasks by person</h3>${bars(byMember, '#6B6462')}</div>
  </div>`;
}

/* ---------- filter popover ---------- */
function renderFilterPop(){
  const group = (key, items, colorKey) => `<div class="pop-group">
    <div class="pop-head">${key === 'assignee' ? 'Assigned to' : key[0].toUpperCase() + key.slice(1)}</div>
    ${items.map(i => `<label class="pop-item">
      <input type="checkbox" data-f="${key}" value="${i.id}"${filters[key].has(i.id) ? ' checked' : ''}>
      ${colorKey ? `<span class="swatch" style="background:${i.color}"></span>` : ''}
      <span>${esc(i.name)}</span></label>`).join('')}
  </div>`;
  $('#filterPop').innerHTML =
    group('progress', PROGRESS, true) +
    group('priority', PRIORITY, false) +
    group('label', state.labels, true) +
    group('assignee', state.members, true) +
    `<div class="pop-foot"><button class="btn-quiet" id="clearFilters">Clear all</button>
     <button class="btn-quiet" id="closeFilters">Done</button></div>`;

  $('#filterPop').querySelectorAll('input[data-f]').forEach(cb =>
    cb.addEventListener('change', () => {
      const set = filters[cb.dataset.f];
      cb.checked ? set.add(cb.value) : set.delete(cb.value);
      render();
    }));
  $('#clearFilters').addEventListener('click', () => {
    Object.values(filters).forEach(s => s.clear());
    renderFilterPop(); render();
  });
  $('#closeFilters').addEventListener('click', toggleFilter);
}
function toggleFilter(){
  const pop = $('#filterPop'), btn = $('#filterBtn');
  const open = pop.hidden;
  if(open) renderFilterPop();
  pop.hidden = !open;
  btn.setAttribute('aria-expanded', String(open));
}

/* ---------- export / import ---------- */
function exportJSON(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = state.title.replace(/\s+/g, '-').toLowerCase() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(!data.tasks || !data.buckets) throw new Error('shape');
      state = normalize(data);
      render();
    }catch(e){
      dialog({title:'That file did not load',
              body:'Choose a JSON file saved with the Export button on this board.',
              ok:'Got it', noCancel:true});
    }
  };
  r.readAsText(file);
}


/* ---------- dialog (replaces confirm/alert, which sandboxed frames block) ---------- */
let dlgResolve = null;
let dlgChain = Promise.resolve();
/* Dialogs wait their turn. Without this, a sync conflict arriving while a
   delete confirmation is open would replace it and strand its answer. */
function dialog(opts){
  const open = () => new Promise(res => {
    $('#dlgTitle').textContent = opts.title || '';
    $('#dlgBody').textContent = opts.body || '';
    $('#dlgBody').hidden = !opts.body;
    $('#dlgExtra').innerHTML = opts.extra || '';
    $('#dlgOk').textContent = opts.ok || 'OK';
    $('#dlgOk').classList.toggle('btn-danger', !!opts.danger);
    $('#dlgOk').classList.toggle('btn-primary', !opts.danger);
    $('#dlgAlt').textContent = opts.alt || '';
    $('#dlgAlt').hidden = !opts.alt;
    $('#dlgCancel').textContent = opts.cancel || 'Cancel';
    $('#dlgCancel').hidden = !!opts.noCancel;
    $('#dlgScrim').hidden = false;
    const first = $('#dlgExtra').querySelector('input');
    (first || $('#dlgOk')).focus();
    dlgResolve = res;
  });
  const shown = dlgChain.then(open);
  dlgChain = shown.catch(() => {});
  return shown;
}
function closeDialog(value){
  $('#dlgScrim').hidden = true;
  const r = dlgResolve; dlgResolve = null;
  if(r) r(value);
}
$('#dlgOk').addEventListener('click', () => {
  const inputs = [...$('#dlgExtra').querySelectorAll('input')].map(i => i.value);
  closeDialog(inputs.length ? inputs : true);
});
$('#dlgCancel').addEventListener('click', () => closeDialog(false));
$('#dlgAlt').addEventListener('click', () => closeDialog('alt'));
$('#dlgScrim').addEventListener('click', e => { if(e.target === $('#dlgScrim')) closeDialog(false); });
$('#dlgExtra').addEventListener('keydown', e => { if(e.key === 'Enter') $('#dlgOk').click(); });

/* ---------- events ---------- */
$('#q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });
$('#groupBy').addEventListener('change', e => { groupBy = e.target.value; render(); });
$('#filterBtn').addEventListener('click', toggleFilter);
document.addEventListener('click', e => {
  if(!$('#filterPop').hidden && !e.target.closest('.ctl')) toggleFilter();
});
document.querySelectorAll('.tab').forEach(tab =>
  tab.addEventListener('click', () => { view = tab.dataset.view; render(); }));
$('#newTask').addEventListener('click', () => {
  const cols = columns();
  addTask(cols[0] ? cols[0].key : '');
});
$('#boardTitle').addEventListener('blur', e => {
  state.title = e.target.textContent.trim() || 'Untitled board';
  render();
});
$('#boardTitle').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
});
$('#exportBtn').addEventListener('click', exportJSON);
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', e => {
  if(e.target.files[0]) importJSON(e.target.files[0]);
  e.target.value = '';
});
$('#resetBtn').addEventListener('click', async () => {
  const go = await dialog({title:'Reset the board?',
    body:'Everything on the board is replaced with the sample content. This cannot be undone.',
    ok:'Reset board', danger:true});
  if(!go) return;
  await store.clear();
  state = seed();
  render();
});

$('#dClose').addEventListener('click', closeDetail);
$('#dDone').addEventListener('click', closeDetail);
$('#scrim').addEventListener('click', closeDetail);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(!$('#dlgScrim').hidden) closeDialog(false);
    else if(!$('#detail').hidden) closeDetail();
    else if(!$('#filterPop').hidden) toggleFilter();
  }
});
function growTitle(){
  const el = $('#dTitle');
  el.style.height = 'auto';
  el.style.height = Math.max(46, el.scrollHeight) + 'px';
}
$('#dTitle').addEventListener('input', e => { growTitle(); edit(t => t.title = e.target.value); });
$('#dBucket').addEventListener('change', e => edit(t => t.bucket = e.target.value));
$('#dProgress').addEventListener('change', e => edit(t => t.progress = e.target.value));
$('#dPriority').addEventListener('change', e => edit(t => t.priority = e.target.value));
$('#dDue').addEventListener('change', e => edit(t => t.due = e.target.value));
$('#dNotes').addEventListener('input', e => edit(t => t.notes = e.target.value));
$('#dAssignees').addEventListener('click', e => {
  const btn = e.target.closest('[data-member]');
  if(!btn) return;
  edit(t => {
    const id = btn.dataset.member;
    t.assignees = t.assignees.includes(id) ? t.assignees.filter(x => x !== id) : t.assignees.concat(id);
  });
  openDetail(openId);
});
$('#dLabels').addEventListener('click', e => {
  const btn = e.target.closest('[data-label]');
  if(!btn) return;
  edit(t => {
    const id = btn.dataset.label;
    t.labels = t.labels.includes(id) ? t.labels.filter(x => x !== id) : t.labels.concat(id);
  });
  openDetail(openId);
});
$('#dAddCheck').addEventListener('click', () => {
  edit(t => t.checklist.push({id:uid('c'), text:'', done:false}));
  renderChecklist(task(openId));
  const inputs = $('#dChecklist').querySelectorAll('input[type=text]');
  if(inputs.length) inputs[inputs.length - 1].focus();
});
$('#dChecklist').addEventListener('change', e => {
  const row = e.target.closest('[data-check]');
  if(!row) return;
  edit(t => {
    const c = t.checklist.find(x => x.id === row.dataset.check);
    if(!c) return;
    if(e.target.type === 'checkbox') c.done = e.target.checked;
    else c.text = e.target.value;
  });
  if(e.target.type === 'checkbox') renderChecklist(task(openId));
});
$('#dChecklist').addEventListener('click', e => {
  const btn = e.target.closest('[data-del-check]');
  if(!btn) return;
  edit(t => t.checklist = t.checklist.filter(c => c.id !== btn.dataset.delCheck));
  renderChecklist(task(openId));
});
/* ---------- links ---------- */
function addLinkFromInputs(){
  const raw  = $('#linkUrl').value.trim();
  if(!raw) return;
  const href = safeUrl(raw.match(/^[a-z]+:\/\//i) ? raw : 'https://' + raw);
  if(!href){
    setFileHint('That does not look like a web address.', true);
    return;
  }
  const label = $('#linkLabel').value.trim();
  edit(t => t.links.push({id:uid('k'), url:href, label:label}));
  $('#linkUrl').value = '';
  $('#linkLabel').value = '';
  renderAttachments(task(openId));
  $('#linkUrl').focus();
}
$('#addLink').addEventListener('click', addLinkFromInputs);
['#linkUrl','#linkLabel'].forEach(sel =>
  $(sel).addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); addLinkFromInputs(); } }));
$('#dLinks').addEventListener('click', e => {
  const btn = e.target.closest('[data-del-link]');
  if(!btn) return;
  edit(t => t.links = t.links.filter(l => l.id !== btn.dataset.delLink));
  renderAttachments(task(openId));
});

/* ---------- files ---------- */
$('#pickFile').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', e => {
  if(e.target.files.length) uploadFiles(e.target.files);
  e.target.value = '';
});

$('#addFile').addEventListener('click', () => addFileFromInputs());
['#fileUrl','#fileName'].forEach(sel =>
  $(sel).addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); addFileFromInputs(); } }));

// Guess a name as soon as a link is pasted, so the field is rarely blank.
$('#fileUrl').addEventListener('input', () => {
  if($('#fileName').value.trim()) return;
  const href = safeUrl($('#fileUrl').value.trim());
  if(!href) return;
  const info = inspectFileLink(href);
  $('#fileName').value = info.name || (info.kind ? info.kind + ' file' : '');
});

// The box takes both: real files get uploaded, a dragged tab becomes a link.
const dropZone = $('#drop');   // note: drop() is the card drag handler
['dragenter','dragover'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('over'); }));
['dragleave','drop'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('over'); }));
dropZone.addEventListener('drop', e => {
  const dt = e.dataTransfer;
  if(!dt) return;
  if(dt.files && dt.files.length){ uploadFiles(dt.files); return; }
  const url = dt.getData('text/uri-list') || dt.getData('text/plain');
  if(url) addFileFromInputs(url);
});

$('#dFiles').addEventListener('click', async e => {
  const btn = e.target.closest('[data-del-file]');
  if(!btn) return;
  const id = btn.dataset.delFile;
  const f  = task(openId).files.find(x => x.id === id);
  const go = await dialog({
    title:'Remove this file?',
    body:(f && f.driveId)
      ? (f.name + ' moves to the Drive trash and comes off this task.')
      : ((f ? f.name + ' ' : '') + 'comes off the task. The file itself stays where it lives.'),
    ok:'Remove', danger:true});
  if(!go) return;
  edit(t => t.files = t.files.filter(x => x.id !== id));
  renderAttachments(task(openId));
  if(f && f.driveId){
    try{ await sync.call({action:'deletefile', id:f.driveId}); }catch(err){}
  }
});

$('#dDelete').addEventListener('click', async () => {
  const t = task(openId);
  if(!t) return;
  const uploads = (t.files || []).filter(f => f.driveId).length;
  const go = await dialog({title:'Delete this task?',
    body:t.title + (uploads ? `. Its ${uploads} uploaded file${uploads>1?'s':''} go${uploads>1?'':'es'} to the Drive trash.` : ''),
    ok:'Delete task', danger:true});
  if(!go) return;
  trashUploads([t]);
  state.tasks = state.tasks.filter(x => x.id !== t.id);
  closeDetail();
});

/* ---------- password gate ---------- */
async function unlock(remember){
  unlocked = true;
  $('#gate').hidden = true;
  if(remember) await store.put(UNLOCK_KEY, PASS_HASH);

  // Local cache first so the board paints straight away.
  applyingRemote = true;
  const cached = await store.load();
  if(cached && cached.tasks && cached.buckets) state = normalize(cached);
  render();
  applyingRemote = false;

  if(!sync.on()){
    setSaveStatus('');
    return;
  }

  setSaveStatus('Opening the shared sheet');
  try{
    const res = await sync.load();
    if(!res || !res.ok) throw new Error(res && res.error);
    sync.rev = res.rev;
    if(res.board && res.board.tasks){
      adoptRemote(res.board);
      setSaveStatus('Opened from the sheet ' + stamp());
    }else{
      // First run: the sheet is empty, so seed it with what we have.
      await pushRemote();
    }
  }catch(e){
    setSaveStatus('Sheet unreachable. Working from this device only.');
  }
}
async function tryPassword(){
  const input = $('#gatePass');
  const err = $('#gateErr');
  if(sha256(input.value) === PASS_HASH){
    err.textContent = '';
    input.value = '';
    await unlock($('#gateRemember').checked);
  }else{
    err.textContent = 'That password did not match. Try again.';
    input.select();
  }
}
$('#gateGo').addEventListener('click', tryPassword);
$('#gatePass').addEventListener('keydown', e => { if(e.key === 'Enter') tryPassword(); });

$('#lockBtn').addEventListener('click', async () => {
  clearTimeout(saveTimer);
  await store.save();
  if(sync.on() && (dirty || pushing)){
    setSaveStatus('Saving before locking');
    while(pushing) await new Promise(r => setTimeout(r, 150));
    if(dirty) await pushRemote();
  }
  await store.drop(UNLOCK_KEY);
  unlocked = false;
  $('#gate').hidden = false;
  $('#gatePass').focus();
});

$('#passBtn').addEventListener('click', async () => {
  const res = await dialog({
    title:'Change the team password',
    body:'Pick a new password, then paste the line below into the file so it sticks for everyone.',
    extra:'<input type="password" id="np1" placeholder="New password" autocomplete="new-password">' +
          '<input type="password" id="np2" placeholder="Repeat it" autocomplete="new-password">',
    ok:'Generate line'});
  if(!res) return;
  const [a, b] = res;
  if(!a || a !== b){
    await dialog({title:'Those did not match', body:'Both fields need the same password.', ok:'Try again', noCancel:true});
    return;
  }
  const line = "const PASS_HASH = '" + sha256(a) + "';";
  await dialog({
    title:'Paste this into the file',
    body:'Open the HTML file in a text editor, find the line that starts with const PASS_HASH and replace it with this one. Save the file and the new password is live.',
    extra:'<code>' + esc(line) + '</code>',
    ok:'Done', noCancel:true});
});

/* ---------- boot ---------- */
(async function(){
  $('#gateLogo').src = document.querySelector('.logo').src;
  const remembered = await store.raw(UNLOCK_KEY);
  if(remembered === PASS_HASH) await unlock(false);
  else $('#gatePass').focus();
})();
</script>
